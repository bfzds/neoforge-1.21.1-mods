org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=true

# 工程属性
mod_id=configpatcher
mod_name=Config Patcher
mod_group_id=dev.configpatcher
mod_version=0.1.0
mod_license=MIT
mod_authors=configpatcher
mod_description=Conditionally rewrites other mods' configs when those mods are present.

# 平台版本（与本机已有的 Gradle 缓存一致，便于离线构建）
minecraft_version=1.21.1
neoforge_version=21.1.216
# 允许的 NeoForge 范围（mods.toml 里用它声明依赖；仓库只收 1.21.1，这里放宽到任意 21.1.x）
neoforge_version_range=[21.1,)
