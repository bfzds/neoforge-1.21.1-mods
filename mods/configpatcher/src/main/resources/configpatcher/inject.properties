# Config Patcher 启动前注入清单
# 位置：<实例目录>/config/configpatcher/inject.properties
# 时机：每次游戏启动的最早期（JVM premain，早于 FML 扫描 mods 目录）自动执行一次。
# 说明：新实例首次启动时由 Agent 自动生成本文件，内容就是本模板；改完下一次启动即生效。
#
# 多个条目之间用分号 ; 分隔。Windows 路径请原样书写（反斜杠不需要转义）。
# 源有两种写法：
#   preset:xxx  —— jar 内置只读预设（换电脑 / 新实例开箱即用，下面默认用它）；
#   绝对路径    —— 指向你的「个人样本库」，样本由 export-samples.ps1 从调好的实例导出，
#                  所有实例下次启动自动套用；想实时跟随样本库就把对应行改成绝对路径。

# 【需求 7 / 9】要注入到本实例 mods 目录的来源（目录或单个 jar）。
# 目标 mods 目录里已经有同 modId 的 mod（不论新旧版本）时会自动跳过，不覆盖整合包自带版本。
# 例：C:\Users\你\Desktop\mc\常用mod\neoforge 1.21.1
modSources=

# 【需求 8】资源包来源：复制到本实例 resourcepacks 目录，并自动写进 options.txt 启用。
resourcePackSources=

# 是否把 Agent jar 自己（也就是本 mod）一并注入 mods 目录。保持 true 才能让配置改写部分一起生效。
injectSelf=true

# 【需求 5】整份覆盖文件：源>实例内相对路径（多个用分号分隔）。
fileOverrides=preset:recipe_type_names.json>config/extendedae_plus/recipe_type_names.json

# 【需求 4】只合并键位（JSON 配置，按层级路径匹配，不动其它开关）。
keybindFileOverrides=preset:tweakeroo.json>config/tweakeroo.json

# 【需求 6】整合包默认键位 + 声音：只把该文件里的 key_* / soundCategory_* / soundDevice 行
# 合并进目标文件，其它设置（分辨率/语言/视野等）保持不动。
keybindSource=preset:options.txt
keybindTarget=options.txt

# 【需求 1/2/3】启动前直接改配置文件里的单个键值（TOML / INI 文本级，保留缩进与行尾注释）。
# 格式：实例内相对路径:段.键=值，多项用分号分隔。下面几条是拿真实整合包配置文件校准过的示例：
#   ae2    config/ae2-client.toml      [terminals]           terminalMargin
#   create config/create-server.toml   [kinetics.encasedFan] fanProcessingTime
#   jei    config/jei/jei-client.ini   [cheating]            giveMode（大写 INVENTORY）
#   jei    config/jei/jei-client.ini   [lookupHistory]       displaySide（大写 RIGHT，查询历史栏靠右显示）
valueEdits=config/ae2-client.toml:terminals.terminalMargin=0;config/create-server.toml:kinetics.encasedFan.fanProcessingTime=0;config/jei/jei-client.ini:cheating.giveMode=INVENTORY;config/jei/jei-client.ini:lookupHistory.displaySide=RIGHT

# 【关闭游戏自动导出】退出游戏时，是否把本实例当前生效的键位 / 文件回写成样本（实例 → 样本）。
# 默认 true：在任意实例里调好键位，关游戏就自动收编，其它实例下次启动跟上，不需要手动跑脚本。
# 语义提醒：开了之后就是「谁最后退出游戏，谁的同名项覆盖样本」；不想参与回写的实例写 false。
# 回写前旧样本会先备份到样本目录的 .backup\<时间戳>\ 下（最多保留 20 份），导错了可以回滚。
# 只回写「源是真实文件路径」的项（preset:xxx 是 jar 内置只读预设，写不回去）。
autoExportOnExit=true
