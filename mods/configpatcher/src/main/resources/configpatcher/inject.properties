# Config Patcher 启动前注入清单
# 位置：<实例目录>/config/configpatcher/inject.properties
# 时机：每次游戏启动的最早期（JVM premain，早于 FML 扫描 mods 目录）自动执行一次。
# 说明：本文件由 Agent 首次启动时自动生成，改完下一次启动即生效。
#
# 多个条目之间用分号 ; 分隔。Windows 路径请原样书写（反斜杠不需要转义）。
# 源可以写绝对路径，也可以写内置预设 preset:xxx（打包在 mod jar 里，换电脑也不会丢）。

# 【需求 7 / 9】要注入到本实例 mods 目录的来源（目录或单个 jar）。
# 目标 mods 目录里已经有同 modId 的 mod（不论新旧版本）时会自动跳过，不覆盖整合包自带版本。
# 例：整合包已带 modernui，则来自这里的 ModernUI 不会被注入。
# 另外还会自动做两件事：
#   1) 同一个来源里有同一 mod 的多个版本时，只注入版本号更大的那个；
#   2) 上次注入过、这次整合包自己带了这个 mod —— 会删掉之前注入的那份（避免重复 mod 崩游戏），
#      只删账本 config/configpatcher/injected.log 里记过的文件，绝不碰整合包自己的文件。
# 下面这些示例路径请改成你自己的目录。
modSources=D:\mc\常用mod\neoforge 1.21.1

# 【需求 8】资源包来源：复制到本实例 resourcepacks 目录，并自动写进 options.txt 启用。
resourcePackSources=D:\mc\常用mod\材质包

# 是否把 Agent jar 自己（也就是本 mod）一并注入 mods 目录。保持 true 才能让配置改写部分一起生效。
injectSelf=true

# 【需求 5】整份覆盖文件：源>实例内相对路径（多个用分号分隔）。
fileOverrides=preset:recipe_type_names.json>config/extendedae_plus/recipe_type_names.json

# 【需求 4】只合并键位（JSON 配置，按层级路径匹配，不动其它开关）。
keybindFileOverrides=preset:tweakeroo.json>config/tweakeroo.json

# 【需求 6】整合包默认键位：只把该文件里的 key_* 合并进目标文件，其它设置（分辨率/语言/视野等）保持不动。
keybindSource=preset:options.txt
keybindTarget=options.txt

# 【需求 1/2/3】启动前直接改配置文件里的单个键值（TOML / INI 文本级，保留缩进与行尾注释）。
# 格式：实例内相对路径:段.键=值，多项用分号分隔。下面三个是拿真实整合包配置文件校准过的示例：
#   ae2    config/ae2-client.toml      [terminals]              terminalMargin
#   create config/create-server.toml   [kinetics.encasedFan]    fanProcessingTime
#   jei    config/jei/jei-client.ini   [cheating]               giveMode（大写 INVENTORY）
valueEdits=config/ae2-client.toml:terminals.terminalMargin=0;config/create-server.toml:kinetics.encasedFan.fanProcessingTime=0;config/jei/jei-client.ini:cheating.giveMode=INVENTORY
