# Config Patcher 启动前注入清单
# 位置：<实例目录>/config/configpatcher/inject.properties
# 时机：每次游戏启动的最早期（JVM premain，早于 FML 扫描 mods 目录）自动执行一次。
# 说明：新实例首次启动时由 Agent 自动生成本文件，内容就是本模板；改完下一次启动即生效。
#
# 多个条目之间用分号 ; 分隔。Windows 路径请原样书写（反斜杠不需要转义）。
# 源可以写绝对路径；本模板默认指向「个人样本库」（方案 A）：
#     C:\Users\30575\Desktop\mc\常用mod\configpatcher-samples
#   样本库里的样本文件由 export-samples.ps1 从「你调好的那个实例」导出，
#   所以在这里调好的键位/配置，会被所有实例在下一次启动时套用。
#   也可以改回内置预设 preset:xxx（打包在 mod jar 里，换电脑也不会丢）。

# 【需求 7 / 9】要注入到本实例 mods 目录的来源（目录或单个 jar）。
# 目标 mods 目录里已经有同 modId 的 mod（不论新旧版本）时会自动跳过，不覆盖整合包自带版本。
# 例：整合包已带 modernui，则来自这里的 ModernUI 不会被注入。
# 另外还会自动做两件事：
#   1) 同一个来源里有同一 mod 的多个版本时，只注入版本号更大的那个；
#   2) 上次注入过、这次整合包自己带了这个 mod —— 会删掉之前注入的那份（避免重复 mod 崩游戏），
#      只删账本 config/configpatcher/injected.log 里记过的文件，绝不碰整合包自己的文件。
modSources=C:\Users\30575\Desktop\mc\常用mod\neoforge 1.21.1

# 【需求 8】资源包来源：复制到本实例 resourcepacks 目录，并自动写进 options.txt 启用。
resourcePackSources=C:\Users\30575\Desktop\mc\常用mod\材质包

# 是否把 Agent jar 自己（也就是本 mod）一并注入 mods 目录。保持 true 才能让配置改写部分一起生效。
injectSelf=true

# 【需求 5】整份覆盖文件：源>实例内相对路径（多个用分号分隔）。
# 样本来自个人样本库（想用 jar 内置的那份，把源改回 preset:recipe_type_names.json）。
fileOverrides=C:\Users\30575\Desktop\mc\常用mod\configpatcher-samples\recipe_type_names.json>config/extendedae_plus/recipe_type_names.json

# 【需求 4】只合并键位（JSON 配置，按层级路径匹配，不动其它开关）。
# 样本来自个人样本库（想用 jar 内置的那份，把源改回 preset:tweakeroo.json）。
keybindFileOverrides=C:\Users\30575\Desktop\mc\常用mod\configpatcher-samples\tweakeroo.json>config/tweakeroo.json

# 【需求 6】整合包默认键位：只把该文件里的 key_* 合并进目标文件，其它设置（分辨率/语言/视野等）保持不动。
# 样本来自个人样本库（想用 jar 内置的那份，把源改回 preset:options.txt）。
keybindSource=C:\Users\30575\Desktop\mc\常用mod\configpatcher-samples\options.txt
keybindTarget=options.txt

# 【需求 1/2/3】启动前直接改配置文件里的单个键值（TOML / INI 文本级，保留缩进与行尾注释）。
# 格式：实例内相对路径:段.键=值，多项用分号分隔。已按你的 ATM10 Sky 实例实测校准：
#   ae2    config/ae2-client.toml      [terminals]              terminalMargin
#   create config/create-server.toml   [kinetics.encasedFan]    fanProcessingTime
#   jei    config/jei/jei-client.ini   [cheating]               giveMode（大写 INVENTORY）
#   jei    config/jei/jei-client.ini   [lookupHistory]          displaySide（大写 RIGHT，查询历史栏靠右显示）
# 这一行的值由 export-samples.ps1 按基准实例的当前值自动刷新。
valueEdits=config/ae2-client.toml:terminals.terminalMargin=0;config/create-server.toml:kinetics.encasedFan.fanProcessingTime=0;config/jei/jei-client.ini:cheating.giveMode=INVENTORY;config/jei/jei-client.ini:lookupHistory.displaySide=RIGHT

# 【关闭游戏自动导出】退出游戏时，是否把本实例当前生效的键位 / 文件回写成样本（实例 → 样本）。
# 默认 true：在任意实例里调好键位，关游戏就自动收编，其它实例下次启动跟上，不需要手动跑脚本。
# 语义提醒：开了之后就是「谁最后退出游戏，谁的配置覆盖样本」；不想参与回写的实例写 false。
# 回写前旧样本会先备份到样本目录的 .backup\<时间戳>\ 下，导错了可以回滚。
# 只回写「源是真实文件路径」的项（preset:xxx 是 jar 内置只读预设，写不回去）。
autoExportOnExit=true